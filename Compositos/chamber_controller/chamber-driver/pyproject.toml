[project]
name = "pani-chamber"
version = "0.1.0"
description = "PC driver for the PANI humidity chamber (Arduino Due firmware FW0.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pyserial>=3.5",
]

[project.scripts]
chamber = "chamber.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chamber"]
